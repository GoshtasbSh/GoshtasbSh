<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How I build spatial intelligence systems</title><desc id="d">A pipeline from spatial evidence through computation and agent reasoning to verified decisions.</desc>
  <rect width="1200" height="300" rx="22" fill="#0b151e"/><g fill="none" stroke="#d7e4ef" stroke-opacity=".07"><path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M100 0v300M200 0v300M300 0v300M400 0v300M500 0v300M600 0v300M700 0v300M800 0v300M900 0v300M1000 0v300M1100 0v300"/></g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="50" y="45" fill="#73e8c0" font-size="12" font-weight="650" letter-spacing="2">THE SYSTEM, NOT JUST THE MODEL</text><text x="50" y="75" fill="#d9e4e9" font-size="20" font-weight="560">Evidence → computation → reasoning → verification → decision</text>
  <g transform="translate(50 120)"><g><rect width="190" height="105" rx="14" fill="#111f29" stroke="#73e8c0" stroke-opacity=".35"/><text x="20" y="32" fill="#73e8c0" font-size="11" font-weight="700">01  SPATIAL EVIDENCE</text><text x="20" y="60" fill="#eef5f5" font-size="15" font-weight="600">Files · parcels · surveys</text><text x="20" y="83" fill="#8295a3" font-size="12">Local-first where required</text></g><path d="M198 53h35" stroke="#73e8c0"/><path d="m228 48 6 5-6 5" fill="none" stroke="#73e8c0"/>
  <g transform="translate(242)"><rect width="190" height="105" rx="14" fill="#111f29" stroke="#73e8c0" stroke-opacity=".25"/><text x="20" y="32" fill="#73e8c0" font-size="11" font-weight="700">02  COMPUTE</text><text x="20" y="60" fill="#eef5f5" font-size="15" font-weight="600">SQL · GIS · simulation</text><text x="20" y="83" fill="#8295a3" font-size="12">Typed, testable operations</text></g><path d="M440 53h35" stroke="#73e8c0"/><path d="m470 48 6 5-6 5" fill="none" stroke="#73e8c0"/>
  <g transform="translate(484)"><rect width="190" height="105" rx="14" fill="#111f29" stroke="#56c8e8" stroke-opacity=".35"/><text x="20" y="32" fill="#56c8e8" font-size="11" font-weight="700">03  AGENT REASONING</text><text x="20" y="60" fill="#eef5f5" font-size="15" font-weight="600">Plan · retrieve · act</text><text x="20" y="83" fill="#8295a3" font-size="12">Human approval gates</text></g><path d="M682 53h35" stroke="#73e8c0"/><path d="m712 48 6 5-6 5" fill="none" stroke="#73e8c0"/>
  <g transform="translate(726)"><rect width="190" height="105" rx="14" fill="#111f29" stroke="#ffc45c" stroke-opacity=".35"/><text x="20" y="32" fill="#ffc45c" font-size="11" font-weight="700">04  VERIFY</text><text x="20" y="60" fill="#eef5f5" font-size="15" font-weight="600">Ground · test · audit</text><text x="20" y="83" fill="#8295a3" font-size="12">Fail closed, show evidence</text></g><path d="M924 53h35" stroke="#73e8c0"/><path d="m954 48 6 5-6 5" fill="none" stroke="#73e8c0"/>
  <g transform="translate(968)"><rect width="132" height="105" rx="14" fill="#173228" stroke="#73e8c0" stroke-opacity=".55"/><text x="18" y="32" fill="#73e8c0" font-size="11" font-weight="700">05  DECIDE</text><text x="18" y="60" fill="#eef5f5" font-size="15" font-weight="600">Map</text><text x="18" y="82" fill="#eef5f5" font-size="15" font-weight="600">Dashboard</text></g></g></g>
</svg>
